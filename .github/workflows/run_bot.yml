name: Run AIHawk Job Applier

on:
  workflow_dispatch: # Gives you a manual "Play" button
  schedule:
    - cron: '0 9 * * *' # Automatically runs every day at 9:00 AM

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Safe, ultra-stable version for cloud bots

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        env:
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
       run: |
          # Bypasses main.py and triggers the core background automation module directly
          python -m src.run_bot
