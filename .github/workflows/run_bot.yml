name: Run AIHawk Job Applier

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Virtual Screen and Chrome Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libgconf-2-4 libnss3-dev libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Launch Bot with Virtual Display Screen
        env:
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: |
          # Starts a virtual desktop screen in the cloud backend
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          
          # Automatically streams the selection options and launches the engine
          printf "\033[B\n\n\n\n" | python main.py
